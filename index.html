
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nourin Gani</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffffff;
            overflow: hidden;
            position: relative;
        }

        /* Floating hearts background */
        .hearts-container {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .heart {
            position: absolute;
            bottom: -50px;
            color: #b49acb;
            opacity: 0;
            font-size: 20px;
            animation: floatHeart linear infinite;
            filter: blur(0.2px);
            will-change: transform, opacity;
        }

        @keyframes floatHeart {
            0% {
                transform: translateY(0) rotate(0deg) scale(0.8);
                opacity: 0;
            }

            15% {
                opacity: 0.45;
            }

            80% {
                opacity: 0.35;
            }

            100% {
                transform: translateY(-115vh) rotate(35deg) scale(1.15);
                opacity: 0;
            }
        }

        /* Main logo */
        .logo-reveal {
            position: relative;
            z-index: 1;
            width: 90%;
            max-width: 900px;
            margin: 0 auto;
            overflow: hidden;
        }

        .logo-reveal img {
            display: block;
            width: 100%;
            height: auto;
            opacity: 0;
            animation: logoReveal 1.5s ease-out forwards;
        }

        @keyframes logoReveal {
            from {
                opacity: 0;
                transform: translateY(15px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @media (max-width: 480px) {
            .logo-reveal {
                width: 94%;
            }

            .heart {
                font-size: 16px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .heart {
                animation: none;
                display: none;
            }

            .logo-reveal img {
                animation: none;
                opacity: 1;
                transform: none;
            }
        }
    </style>
</head>

<body>

    <div class="hearts-container" id="hearts"></div>

    <div class="logo-reveal">
        <img src="Nourin Gani.png" alt="Nourin Gani Logo">
    </div>

    <script>
        const heartsContainer = document.getElementById("hearts");

        const heartSymbols = ["♥", "♡", "❤"];

        for (let i = 0; i < 22; i++) {
            const heart = document.createElement("span");

            heart.className = "heart";
            heart.textContent =
                heartSymbols[Math.floor(Math.random() * heartSymbols.length)];

            heart.style.left = Math.random() * 100 + "%";
            heart.style.fontSize = (12 + Math.random() * 18) + "px";
            heart.style.animationDuration = (8 + Math.random() * 10) + "s";
            heart.style.animationDelay = (-Math.random() * 18) + "s";

            heartsContainer.appendChild(heart);
        }
    </script>

</body>
</html>
